<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Baggins Corp</title>
  
  <!-- CSS -->
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/layout.css">
  <link rel="stylesheet" href="assets/css/components.css">
</head>
<body>
  
  <!-- Tempat Navbar Dirender -->
  <div id="navbar-root"></div>
  
  <!-- Tempat Halaman (Router) Dirender -->
  <main id="app">
    <!-- Konten otomatis dimuat via JS -->
  </main>

  <!-- Script Utama -->
  <script type="module">
    import { createNavbar } from './assets/js/components/navbar.js';
    import { initRouter } from './assets/js/core/router.js';
    
    // Pasang komponen Navbar ke DOM
    const navbarRoot = document.getElementById('navbar-root');
    navbarRoot.appendChild(createNavbar());
    
    // Inisialisasi router SPA
    initRouter();
  </script>
</body>
</html>
